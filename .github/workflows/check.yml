name: Check macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Test core without UI
        run: cargo test --workspace --no-default-features --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build local application bundle
        run: bash scripts/bundle-macos.sh
      - name: Archive app with macOS metadata
        run: ditto -c -k --sequesterRsrc --keepParent dist/Framecraft.app dist/Framecraft-macos.zip
      - name: Upload development bundle
        uses: actions/upload-artifact@v4
        with:
          name: Framecraft-macos-development
          path: dist/Framecraft-macos.zip

